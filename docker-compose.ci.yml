# Docker Compose 配置文件 - CI/CD 专用
# 使用标准端口以兼容测试脚本

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cbit_aiforge_backend
    ports:
      - "8000:8000"  # CI/CD 使用标准端口
    volumes:
      - ./backend/app/data:/app/app/data
      - ./logs:/app/logs
    environment:
      - USE_GPU=false
      - DEBUG=false
      - API_HOST=0.0.0.0
      - API_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - aiforge_network
    dns:
      - 8.8.8.8
      - 114.114.114.114

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cbit_aiforge_frontend
    ports:
      - "80:80"  # CI/CD 使用标准端口
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - aiforge_network
    dns:
      - 8.8.8.8
      - 114.114.114.114

networks:
  aiforge_network:
    driver: bridge

